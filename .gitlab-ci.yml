stages:
  - verify
  - package
  - mirror
  - deploy

default:
  interruptible: true

frontend:
  stage: verify
  image: node:24-alpine
  cache:
    key: frontend-dist-v1
    paths:
      - frontend/dist/
  script:
    - node scripts/ci_frontend.mjs
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 day

backend:
  stage: verify
  image: nikolaik/python-nodejs@sha256:35a2f99a0e220ed230ecf8a90521d7c81369952653f33c1ad02e6f7519af439d
  needs:
    - job: frontend
      artifacts: true
  rules:
    - changes:
        - .gitlab-ci.yml
        - Dockerfile
        - app/**/*
        - packages/**/*
        - scripts/**/*
        - tests/**/*
        - deploy/**/*
        - pyproject.toml
        - uv.lock
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  cache:
    key:
      prefix: python312-node24
      files:
        - uv.lock
    paths:
      - .cache/uv/
    when: always
  script:
    - node --version && npm --version && python3 --version && uv --version && git --version
    - uv sync --frozen --python /usr/local/bin/python3
    - OWS_COMMUNITY_ENVIRONMENT=test OWS_COMMUNITY_NEWS_SYNC_ENABLED=false uv run --no-sync pytest -q --ignore=tests/test_launcher.py

launcher:
  stage: verify
  image: nikolaik/python-nodejs@sha256:35a2f99a0e220ed230ecf8a90521d7c81369952653f33c1ad02e6f7519af439d
  rules:
    - changes:
        - .gitlab-ci.yml
        - app/__main__.py
        - frontend/**/*
        - packages/**/*
        - scripts/serve_frontend.py
        - tests/test_launcher.py
        - pyproject.toml
        - uv.lock
  variables:
    NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  cache:
    key:
      prefix: python312-node24-launcher
      files:
        - uv.lock
    paths:
      - .cache/npm/
      - .cache/uv/
    when: always
  script:
    - npm ci --prefix frontend --prefer-offline
    - uv sync --frozen --python /usr/local/bin/python3
    - OWS_COMMUNITY_ENVIRONMENT=test OWS_COMMUNITY_NEWS_SYNC_ENABLED=false uv run --no-sync pytest -q tests/test_launcher.py

mirror_github:
  stage: mirror
  image: node:24-bookworm
  interruptible: false
  variables:
    GIT_DEPTH: "0"
  needs:
    - job: package_release
      artifacts: false
      optional: true
    - job: frontend
      artifacts: false
    - job: backend
      artifacts: false
      optional: true
    - job: launcher
      artifacts: false
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - test -f "$GITHUB_MIRROR_SSH_KEY"
    - install -d -m 0700 "$HOME/.ssh"
    - install -m 0600 "$GITHUB_MIRROR_SSH_KEY" "$HOME/.ssh/id_ed25519"
    - install -m 0644 deploy/ci/github_known_hosts "$HOME/.ssh/known_hosts"
    - export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
    - git push ssh://git@ssh.github.com:443/IXYTYXI/onion_communiyt.git "HEAD:refs/heads/main"
    - test "$(git ls-remote ssh://git@ssh.github.com:443/IXYTYXI/onion_communiyt.git refs/heads/main | cut -f1)" = "$CI_COMMIT_SHA"

package_release:
  stage: package
  image: python:3.12-bookworm
  rules:
    - changes:
        - app/**/*
        - frontend/src/**/*
        - frontend/public/**/*
        - frontend/assets/**/*
        - frontend/*.html
        - frontend/package*.json
        - frontend/vite.config.js
        - packages/deploy-engine/src/**/*
        - packages/deploy-engine/pyproject.toml
        - scripts/*.py
        - pyproject.toml
        - uv.lock
  needs:
    - job: frontend
      artifacts: true
    - job: backend
      artifacts: false
      optional: true
    - job: launcher
      artifacts: false
      optional: true
  script:
    - python3 scripts/package_release.py create --root . --archive release.tar.gz --commit "$CI_COMMIT_SHA"
    - sha256sum release.tar.gz | cut -d ' ' -f1 > release.sha256
    - python3 scripts/package_release.py verify --archive release.tar.gz --digest "$(cat release.sha256)" --commit "$CI_COMMIT_SHA"
  artifacts:
    paths:
      - release.tar.gz
      - release.sha256
    expire_in: 1 day

deploy_production:
  stage: deploy
  image: node:24-bookworm
  interruptible: false
  resource_group: ows-community-production
  environment:
    name: production
  needs:
    - job: package_release
      artifacts: true
    - job: mirror_github
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - app/**/*
        - frontend/src/**/*
        - frontend/public/**/*
        - frontend/assets/**/*
        - frontend/*.html
        - frontend/package*.json
        - frontend/vite.config.js
        - packages/deploy-engine/src/**/*
        - packages/deploy-engine/pyproject.toml
        - scripts/*.py
        - pyproject.toml
        - uv.lock
  script:
    - test -f "$OWS_DEPLOY_SSH_KEY"
    - test -f "$OWS_DEPLOY_KNOWN_HOSTS"
    - install -d -m 0700 "$HOME/.ssh"
    - install -m 0600 "$OWS_DEPLOY_SSH_KEY" "$HOME/.ssh/id_ed25519"
    - install -m 0644 "$OWS_DEPLOY_KNOWN_HOSTS" "$HOME/.ssh/known_hosts"
    - export OWS_SSH="ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
    - test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CI_COMMIT_SHA"
    - scp -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes release.tar.gz "ows-release@$OWS_DEPLOY_HOST:/var/spool/ows-community-release/$CI_COMMIT_SHA.tar.gz"
    - $OWS_SSH "ows-release@$OWS_DEPLOY_HOST" "sudo /usr/local/libexec/ows-community/activate.sh $CI_COMMIT_SHA $(cat release.sha256)"
    - $OWS_SSH "ows-release@$OWS_DEPLOY_HOST" "test \"\$(cat /opt/ows-community/.release-commit)\" = $CI_COMMIT_SHA"
